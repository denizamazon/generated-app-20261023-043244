<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full bg-slate-50 text-slate-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <meta name="theme-color" content="#FF6A00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="شاهکار" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" />
  <title>بازارگاه اینترنتی بین‌المللی | پلتفرم چندفروشنده‌ای شاهکار</title>
  
  <!-- Vazirmatn Persian Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#fff8f2',
              100: '#ffede0',
              200: '#ffd6bd',
              300: '#ffb58a',
              400: '#ff894d',
              500: '#ff6600', // Alibaba Signature Orange
              600: '#e05500',
              700: '#b84000',
              800: '#943407',
              900: '#782d0c',
              950: '#411403',
            },
            alibaba: {
              orange: '#FF6A00',
              orangeHover: '#E05900',
              dark: '#1E2229',
              darker: '#14171C',
              navy: '#0F172A',
              gold: '#FFB800',
              goldBg: '#FFFBEB',
              bg: '#F4F5F7',
              border: '#E2E8F0',
              blue: '#0066FF'
            },
            brand: {
              emerald: '#059669',
              amber: '#d97706',
              rose: '#e11d48',
            }
          }
        }
      }
    }
  </script>

  <!-- Importmap for React and Lucide Icons -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Custom scrollbar for clean UI */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased selection:bg-primary-500 selection:text-white">
  <div id="root" class="min-h-full flex flex-col"></div>

  <!-- Service Worker Registration for PWA Mobile App -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(registration) {
          console.log('Shahkar PWA ServiceWorker registered with scope:', registration.scope);
        }, function(err) {
          console.log('Shahkar PWA ServiceWorker registration failed:', err);
        });
      });
    }
  </script>

  <!-- React Main Script -->
  <script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>
</body>
</html>
